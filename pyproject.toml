[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "localscribe"
version = "0.1.9"
description = "Private, local-first voice dictation and cleanup for Windows"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "LocalScribe contributors"}]
keywords = ["whisper", "dictation", "speech-to-text", "offline", "local-llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.26,<3",
  "platformdirs>=4.2,<5",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
app = [
  "PySide6>=6.7,<7",
  "sounddevice>=0.4.7,<1",
  "faster-whisper>=1.1,<2",
  "huggingface-hub>=0.27,<2",
  "pynput>=1.7.7,<2",
  "pyperclip>=1.9,<2",
]
llm = ["llama-cpp-python>=0.3.4,<1"]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "mypy>=1.14,<3",
  "pyinstaller>=6.11,<7",
  "types-psutil>=7,<8",
  "types-pynput>=1.8,<2",
  "types-pyperclip>=1.9,<2",
]

[project.scripts]
localscribe = "localscribe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/localscribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=localscribe --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
omit = [
  "src/localscribe/app.py",
  "src/localscribe/audio.py",
  "src/localscribe/platforms.py",
  "src/localscribe/transcription.py",
  "src/localscribe/ui.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
packages = ["localscribe"]
exclude = ["src/localscribe/ui.py", "src/localscribe/app.py"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["ctranslate2", "ctranslate2.*", "faster_whisper", "faster_whisper.*", "huggingface_hub", "huggingface_hub.*", "llama_cpp", "llama_cpp.*", "sounddevice", "sounddevice.*"]
ignore_missing_imports = true
